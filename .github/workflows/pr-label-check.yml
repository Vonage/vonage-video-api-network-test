name: PR Label Check

# Runs on label changes as well as PR open/sync so the check re-evaluates
# after Release Drafter auto-applies a label from the PR title.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: read-all

concurrency:
  # Multiple events fire on the same PR in quick succession — for example, a push triggers
  # one run and Release Drafter's auto-labeler triggers a second immediately after. Without
  # a concurrency group the first run may report failure before the label was applied.
  # Grouping by ref ensures only the most recent event's run is live per PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label-check:
    name: Release label required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check for release label
        shell: bash
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          # Labels that map to a release-drafter category or explicitly opt out of the changelog.
          VALID="enhancement feature bug fix documentation chore maintenance dependencies other skip-changelog"
          FOUND=$(echo "$PR_LABELS" | jq -r '.[].name' \
            | grep -Fx -f <(tr ' ' '\n' <<< "$VALID") \
            | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::No release label found on this PR."
            echo ""
            echo "Add one of: $VALID"
            echo ""
            echo "If the PR title starts with feat:, fix:, docs:, or chore:,"
            echo "Release Drafter will apply the correct label automatically."
            echo "Re-push or re-open the PR to trigger the autolabeler."
            exit 1
          fi
          echo "✅ Release label: $FOUND"
