name: Remove Package Version

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target package'
        required: true
        type: choice
        default: 'vonage'
        options:
          - 'vonage'
          - 'opentok'
      registry:
        description: 'NPM registry to remove from'
        required: true
        type: choice
        default: 'npmjs.com'
        options:
          - 'github.com'
          - 'npmjs.com'
      version:
        description: 'Package version to remove (e.g. 5.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (test without removing)'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel: a removal mid-flight could leave the registry in an inconsistent state.

permissions: read-all

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Remove ${{ inputs.target }}@${{ inputs.version }} from ${{ inputs.registry }}
    permissions:
      packages: write  # Required to delete GitHub Packages versions.
    steps:
      - name: Remove from npmjs.com
        if: inputs.registry == 'npmjs.com'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          # vonage → @vonage/video-client-network-test
          # opentok → opentok-network-test-js (unscoped, matching publish-package.yml)
          PACKAGE_NAME: ${{ inputs.target == 'vonage' && '@vonage/video-client-network-test' || 'opentok-network-test-js' }}
          NODE_AUTH_TOKEN: ${{ inputs.target == 'vonage' && secrets.NPM_TOKEN_VONAGE || secrets.NPM_TOKEN_OPENTOK }}
        shell: bash
        run: |
          echo "Target: ${PACKAGE_NAME}@${VERSION}"

          # Verify the version exists before attempting removal.
          PUBLISHED=$(npm view "${PACKAGE_NAME}@${VERSION}" version \
            --registry https://registry.npmjs.org 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ]; then
            echo "❌ Version ${VERSION} of ${PACKAGE_NAME} not found on npmjs.com"
            exit 1
          fi

          if [ "$DRY_RUN" == "true" ]; then
            echo "✅ Dry run — would unpublish ${PACKAGE_NAME}@${VERSION} from npmjs.com"
            exit 0
          fi

          npm unpublish "${PACKAGE_NAME}@${VERSION}" --registry https://registry.npmjs.org
          echo "✅ Unpublished ${PACKAGE_NAME}@${VERSION} from npmjs.com"

      - name: Remove from GitHub Packages
        if: inputs.registry == 'github.com'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          # vonage → org: Vonage, package: video-client-network-test
          # opentok → org: opentok, package: opentok-network-test-js
          GH_ORG: ${{ inputs.target == 'vonage' && 'Vonage' || 'opentok' }}
          PACKAGE_NAME: ${{ inputs.target == 'vonage' && 'video-client-network-test' || 'opentok-network-test-js' }}
          # @vonage packages live in this repo's org — GITHUB_TOKEN has write:packages.
          # @opentok packages live in a different org — PAT with write:packages on opentok org is required.
          GH_TOKEN: ${{ inputs.target == 'vonage' && secrets.GITHUB_TOKEN || secrets.NPM_TOKEN_OPENTOK_GITHUB }}
        shell: bash
        run: |
          echo "Target: @${GH_ORG}/${PACKAGE_NAME}@${VERSION}"

          # Resolve the numeric version ID required by the GitHub Packages API.
          VERSION_ID=$(gh api "/orgs/${GH_ORG}/packages/npm/${PACKAGE_NAME}/versions" \
            --jq ".[] | select(.name == \"${VERSION}\") | .id" 2>/dev/null || echo "")
          if [ -z "$VERSION_ID" ]; then
            echo "❌ Version ${VERSION} of @${GH_ORG}/${PACKAGE_NAME} not found on GitHub Packages"
            exit 1
          fi

          if [ "$DRY_RUN" == "true" ]; then
            echo "✅ Dry run — would delete @${GH_ORG}/${PACKAGE_NAME}@${VERSION} (id: ${VERSION_ID}) from GitHub Packages"
            exit 0
          fi

          gh api --method DELETE "/orgs/${GH_ORG}/packages/npm/${PACKAGE_NAME}/versions/${VERSION_ID}"
          echo "✅ Deleted @${GH_ORG}/${PACKAGE_NAME}@${VERSION} from GitHub Packages"
