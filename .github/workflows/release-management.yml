name: Release Management

# When changesets are merged to main, this workflow opens (or updates) a
# "Version Packages" PR that bumps package.json and updates CHANGELOG.md.
# You can review and edit the CHANGELOG in that PR before merging it.
# Once merged, the publish-package workflow can be dispatched to release.

on:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Install dependencies
        run: npm ci

      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
