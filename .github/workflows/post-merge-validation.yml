name: Post Merge Validation

on:
  push:
    branches:
      - main
      - 'release-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel: package artifacts may be mid-upload.

permissions: read-all

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          target: ${{ matrix.target }}
          node_version: ${{ vars.NODE_VERSION }}

      - name: Test
        uses: ./.github/actions/run-test
        with:
          target: ${{ matrix.target }}
          vonage_private_key: ${{ secrets.VONAGE_PRIVATE_KEY }}
          test_application_id: ${{ secrets.TEST_APPLICATION_ID }}
          test_api_key: ${{ secrets.TEST_API_KEY }}
          test_api_secret: ${{ secrets.TEST_API_SECRET }}

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package
        uses: ./.github/actions/build-and-package-library
        with:
          target: ${{ matrix.target }}
          node_version: ${{ vars.NODE_VERSION }}

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-package-tarball
          path: lib/js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: publint
        shell: bash
        run: |
          TARBALL=$(find lib/js -maxdepth 1 -name '*.tgz' | head -1)
          echo "Running publint on: $TARBALL"
          npx --yes publint "$TARBALL"

      - name: attw (are the types wrong)
        continue-on-error: true  # "type":"module" vs UMD — known issue, informational only until resolved
        shell: bash
        run: |
          TARBALL=$(find lib/js -maxdepth 1 -name '*.tgz' | head -1)
          echo "Running attw on: $TARBALL"
          npx --yes @arethetypeswrong/cli "$TARBALL"
