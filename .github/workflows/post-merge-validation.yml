name: Post Merge Validation

on:
  push:
    branches:
      - main
      - 'release-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel: package artifacts may be mid-upload.

permissions: read-all

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          target: ${{ matrix.target }}
          node_version: ${{ vars.NODE_VERSION }}

      - name: Test
        uses: ./.github/actions/run-test
        with:
          target: ${{ matrix.target }}
          vonage_private_key: ${{ secrets.VONAGE_PRIVATE_KEY }}
          test_application_id: ${{ secrets.TEST_APPLICATION_ID }}
          test_api_key: ${{ secrets.TEST_API_KEY }}
          test_api_secret: ${{ secrets.TEST_API_SECRET }}

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package
        uses: ./.github/actions/build-and-package-library
        with:
          target: ${{ matrix.target }}
          node_version: ${{ vars.NODE_VERSION }}

  verify-artifacts:
    name: Verify ${{ matrix.target }} tarball
    needs: package
    strategy:
      fail-fast: false
      matrix:
        target: [vonage, opentok]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-package-tarball
          path: tarball

      - name: Verify tarball contains dist/index.js
        shell: bash
        run: |
          TARBALL=$(find tarball -name '*.tgz' | head -1)
          # Capture listing into a variable to avoid tar SIGPIPE under pipefail
          CONTENTS=$(tar tzf "$TARBALL")
          if ! echo "$CONTENTS" | grep -qE 'package/dist/index\.js$'; then
            echo "❌ dist/index.js not found in tarball — build output path mismatch"
            echo "$CONTENTS" | grep 'dist/' || echo "(no dist/ entries at all)"
            exit 1
          fi
          echo "✅ dist/index.js present in $TARBALL"
