name: Required AI Adoption label

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened, edited]

jobs:
  require-ai-adoption-label:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Required Label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);

            const requiredLabels = ['ai-assisted', 'ai-generated', 'no-ai', 'ai-touched'];

            const hasMatch = labels.some(label => requiredLabels.includes(label));

            if (!hasMatch) {
              const table = [
                '| Label | When to use |',
                '|-------|-------------|',
                '| `ai-generated` | More than 90 % of the code originates from AI tools (Copilot, Kiro, ChatGPT, etc.) regardless of delivery method (generation, copy-paste, dictation). |',
                '| `ai-assisted` | Between 20 % and 90 % of the code was produced with AI help, but meaningful human contribution is present. |',
                '| `ai-touched` | AI was used lightly (under 20 %) — e.g. autocomplete suggestions, minor refactors, or doc generation. |',
                '| `no-ai` | No AI assistance was involved at all. |',
              ].join('\n');

              core.setFailed(
                `❌ This PR is missing a required AI Adoption label.\n\n` +
                `Please add **at least one** of the following labels before merging:\n\n` +
                `${table}\n\n` +
                `> Apply the label that best reflects the level of AI involvement in this PR.`
              );
            }
