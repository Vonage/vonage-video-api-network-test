name: Publish Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target package'
        required: true
        type: choice
        default: 'vonage'
        options:
          - 'vonage'
          - 'opentok'
      registry:
        description: 'NPM registry to publish to'
        required: true
        type: choice
        default: 'npmjs.com'
        options:
          - 'github.com'
          - 'npmjs.com'
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Pre-release tag appended to the version and used as the dist-tag (e.g., alpha → 1.2.3-alpha). Leave empty to publish the version as-is with the "latest" dist-tag.'
        required: false
        type: string
        default: ''
      run_id:
        description: 'Numeric CI run ID to publish from (find it in the Actions tab URL). Leave empty to use the latest successful run on the current branch.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel: a publish mid-flight could leave the registry in an inconsistent state.

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Publish ${{ inputs.target }} to ${{ inputs.registry }}
    permissions:
      contents: write  # Required to create tags and GitHub Releases.
      packages: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # dry_run, tag, run_id, and github_token are shared across all three steps;
      # update all three if publish-package gains new shared inputs.
      - name: Publish Vonage Package
        id: publish-vonage
        if: inputs.target == 'vonage'
        uses: ./.github/actions/publish-package
        with:
          target: vonage
          registry: ${{ inputs.registry }}
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: vonage
          github_token: ${{ secrets.GITHUB_TOKEN }}
          npm_token: ${{ secrets.NPM_TOKEN_VONAGE }}
          node_version: ${{ vars.NODE_VERSION }}
          # @vonage packages live in this repo's org, so the built-in GITHUB_TOKEN has write:packages.
          github_packages_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OpenTok Package to GitHub
        id: publish-opentok-github
        if: inputs.target == 'opentok' && inputs.registry == 'github.com'
        uses: ./.github/actions/publish-package
        with:
          target: opentok
          registry: github.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: opentok
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # @opentok packages live in a different GitHub org; GITHUB_TOKEN cannot publish
          # across org boundaries, so a PAT with write:packages on the opentok org is required.
          github_packages_token: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}
          node_version: ${{ vars.NODE_VERSION }}

      - name: Publish OpenTok Package to NPM
        id: publish-opentok-npm
        if: inputs.target == 'opentok' && inputs.registry == 'npmjs.com'
        uses: ./.github/actions/publish-package
        with:
          target: opentok
          registry: npmjs.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: unscoped
          github_token: ${{ secrets.GITHUB_TOKEN }}
          npm_token: ${{ secrets.NPM_TOKEN_OPENTOK }}
          node_version: ${{ vars.NODE_VERSION }}

      # Reads the final version and name written to lib/js/package.json by the publish action.
      # Skipped entirely on dry runs — no tag or release is created.
      - name: Resolve published version
        if: ${{ !fromJSON(inputs.dry_run) }}
        id: release-meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./lib/js/package.json').version")
          NAME=$(node -p "require('./lib/js/package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.target }}-v${VERSION}" >> "$GITHUB_OUTPUT"

      # Promotes the Release Drafter draft if one exists (accumulated changelog from all
      # PR merges since the last release). Falls back to a fresh release with auto-generated
      # notes if no draft is found (e.g., first release or draft was manually deleted).
      - name: Publish GitHub Release
        if: ${{ !fromJSON(inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          TITLE: "${{ inputs.target }} v${{ steps.release-meta.outputs.version }}"
        shell: bash
        run: |
          DRAFT_TAG=$(gh release list --json tagName,isDraft \
            --jq '[.[] | select(.isDraft==true)] | first | .tagName // empty')

          if [ -n "$DRAFT_TAG" ]; then
            echo "Promoting draft '$DRAFT_TAG' → '$TAG'"
            gh release edit "$DRAFT_TAG" --tag "$TAG" --title "$TITLE" --draft=false
          else
            echo "No draft found — creating release '$TAG'"
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi
