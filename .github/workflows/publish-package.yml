name: Publish Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Package variant to publish'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '@vonage/video-client-network-test → npmjs.com'
          - '@vonage/video-client-network-test → GitHub Packages'
          - 'opentok-network-test-js → npmjs.com'
          - '@opentok/opentok-network-test-js → GitHub Packages'
      dry_run:
        description: 'Dry run mode (test without publishing)'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Pre-release tag appended to the version and used as the dist-tag (e.g., alpha → 1.2.3-alpha). Leave empty to publish the version as-is with the "latest" dist-tag.'
        required: false
        type: string
        default: ''
      run_id:
        description: 'Numeric CI run ID to publish from (find it in the Actions tab URL). Leave empty to use the latest successful run on the current branch.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Never cancel: a publish mid-flight could leave the registry in an inconsistent state.

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Publish v${{ inputs.tag || 'latest' }} (${{ inputs.target }})
    permissions:
      contents: write  # Required to create tags and GitHub Releases.
      packages: write
      actions: read
    outputs:
      version:                  ${{ steps.release-meta.outputs.version }}
      vonage-npmjs-published:   ${{ steps.outcomes.outputs.vonage-npmjs }}
      vonage-github-published:  ${{ steps.outcomes.outputs.vonage-github }}
      opentok-npmjs-published:  ${{ steps.outcomes.outputs.opentok-npmjs }}
      opentok-github-published: ${{ steps.outcomes.outputs.opentok-github }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate run_id source
        if: inputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" 2>&1); then
            echo "::error::Could not fetch run ${{ inputs.run_id }}: $RUN_JSON"
            exit 1
          fi
          WORKFLOW=$(echo "$RUN_JSON" | jq -r '.name')
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
          STATUS=$(echo "$RUN_JSON"   | jq -r '.status')

          echo "Run ID:     ${{ inputs.run_id }}"
          echo "Workflow:   $WORKFLOW"
          echo "Status:     $STATUS"
          echo "Conclusion: $CONCLUSION"

          if [ "$WORKFLOW" != "Post Merge Validation" ]; then
            echo "::error::run_id ${{ inputs.run_id }} belongs to '$WORKFLOW'."
            echo "::error::Only artifacts from a successful 'Post Merge Validation' run may be published."
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::run_id ${{ inputs.run_id }} did not succeed (conclusion: $CONCLUSION)."
            echo "::error::Cannot publish from a failed or incomplete run."
            exit 1
          fi
          echo "✅ Verified: run ${{ inputs.run_id }} is a successful Post Merge Validation run"

      - name: '@vonage/video-client-network-test → npmjs.com'
        id: vonage-npmjs
        if: inputs.target == 'all' || inputs.target == '@vonage/video-client-network-test → npmjs.com'
        continue-on-error: true
        uses: ./.github/actions/publish-package
        with:
          target: vonage
          registry: npmjs.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: vonage
          github_token: ${{ secrets.GITHUB_TOKEN }}
          npm_token: ${{ secrets.NPM_TOKEN_VONAGE }}
          node_version: ${{ vars.NODE_VERSION }}
          github_packages_token: ${{ secrets.GITHUB_TOKEN }}

      - name: '@vonage/video-client-network-test → GitHub Packages'
        id: vonage-github
        if: inputs.target == 'all' || inputs.target == '@vonage/video-client-network-test → GitHub Packages'
        continue-on-error: true
        uses: ./.github/actions/publish-package
        with:
          target: vonage
          registry: github.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: vonage
          github_token: ${{ secrets.GITHUB_TOKEN }}
          node_version: ${{ vars.NODE_VERSION }}
          # @vonage packages live in this repo's org, so the built-in GITHUB_TOKEN has write:packages.
          github_packages_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'opentok-network-test-js → npmjs.com'
        id: opentok-npmjs
        if: inputs.target == 'all' || inputs.target == 'opentok-network-test-js → npmjs.com'
        continue-on-error: true
        uses: ./.github/actions/publish-package
        with:
          target: opentok
          registry: npmjs.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: unscoped
          github_token: ${{ secrets.GITHUB_TOKEN }}
          npm_token: ${{ secrets.NPM_TOKEN_OPENTOK }}
          node_version: ${{ vars.NODE_VERSION }}

      - name: '@opentok/opentok-network-test-js → GitHub Packages'
        id: opentok-github
        if: inputs.target == 'all' || inputs.target == '@opentok/opentok-network-test-js → GitHub Packages'
        continue-on-error: true
        uses: ./.github/actions/publish-package
        with:
          target: opentok
          registry: github.com
          dry_run: ${{ inputs.dry_run }}
          tag: ${{ inputs.tag }}
          run_id: ${{ inputs.run_id }}
          organization: opentok
          github_token: ${{ secrets.GITHUB_TOKEN }}
          node_version: ${{ vars.NODE_VERSION }}
          # @opentok packages live in a different GitHub org; GITHUB_TOKEN cannot publish
          # across org boundaries, so a PAT with write:packages on the opentok org is required.
          github_packages_token: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}

      - name: Compute publish outcomes
        id: outcomes
        if: always()
        shell: bash
        env:
          VN_OUTCOME: ${{ steps.vonage-npmjs.outcome }}
          VN_SKIP:    ${{ steps.vonage-npmjs.outputs.already_published }}
          VG_OUTCOME: ${{ steps.vonage-github.outcome }}
          VG_SKIP:    ${{ steps.vonage-github.outputs.already_published }}
          ON_OUTCOME: ${{ steps.opentok-npmjs.outcome }}
          ON_SKIP:    ${{ steps.opentok-npmjs.outputs.already_published }}
          OG_OUTCOME: ${{ steps.opentok-github.outcome }}
          OG_SKIP:    ${{ steps.opentok-github.outputs.already_published }}
        run: |
          # "published" = step succeeded AND was not skipped due to already-published
          published() { [ "$1" == "success" ] && [ "$2" != "true" ] && echo "true" || echo "false"; }
          echo "vonage-npmjs=$(published "$VN_OUTCOME" "$VN_SKIP")"   >> "$GITHUB_OUTPUT"
          echo "vonage-github=$(published "$VG_OUTCOME" "$VG_SKIP")"  >> "$GITHUB_OUTPUT"
          echo "opentok-npmjs=$(published "$ON_OUTCOME" "$ON_SKIP")"  >> "$GITHUB_OUTPUT"
          echo "opentok-github=$(published "$OG_OUTCOME" "$OG_SKIP")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          TARGET:              ${{ inputs.target }}
          VONAGE_NPMJS:        ${{ steps.vonage-npmjs.outcome }}
          VONAGE_GITHUB:       ${{ steps.vonage-github.outcome }}
          OPENTOK_NPMJS:       ${{ steps.opentok-npmjs.outcome }}
          OPENTOK_GITHUB:      ${{ steps.opentok-github.outcome }}
          VONAGE_NPMJS_SKIP:   ${{ steps.vonage-npmjs.outputs.already_published }}
          VONAGE_GITHUB_SKIP:  ${{ steps.vonage-github.outputs.already_published }}
          OPENTOK_NPMJS_SKIP:  ${{ steps.opentok-npmjs.outputs.already_published }}
          OPENTOK_GITHUB_SKIP: ${{ steps.opentok-github.outputs.already_published }}
        shell: bash
        run: |
          status() {
            local outcome="$1" skip="$2"
            if   [ "$outcome" == "skipped" ];                            then echo "⏭️ \`not selected\`"
            elif [ "$outcome" == "success" ] && [ "$skip" == "true" ];   then echo "ℹ️ \`already published, skipped\`"
            elif [ "$outcome" == "success" ];                            then echo "✅ \`published\`"
            else                                                              echo "❌ \`$outcome\`"
            fi
          }
          echo "### Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@vonage/video-client-network-test\` → npmjs.com       | $(status "$VONAGE_NPMJS" "$VONAGE_NPMJS_SKIP") |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@vonage/video-client-network-test\` → GitHub Packages | $(status "$VONAGE_GITHUB" "$VONAGE_GITHUB_SKIP") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`opentok-network-test-js\` → npmjs.com                 | $(status "$OPENTOK_NPMJS" "$OPENTOK_NPMJS_SKIP") |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@opentok/opentok-network-test-js\` → GitHub Packages  | $(status "$OPENTOK_GITHUB" "$OPENTOK_GITHUB_SKIP") |" >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if any selected step failed (skipped = not selected, which is fine).
          fails() { [ "$1" == "failure" ] || [ "$1" == "cancelled" ]; }
          if fails "$VONAGE_NPMJS" || fails "$VONAGE_GITHUB" || \
             fails "$OPENTOK_NPMJS" || fails "$OPENTOK_GITHUB"; then
            echo "::error::One or more publish steps failed — see summary above."
            exit 1
          fi

          # When publishing a specific target (not "all"), treat already-published as an error:
          # the user explicitly chose a single variant, so a duplicate publish is unexpected.
          if [ "$TARGET" != "all" ]; then
            if [ "$VONAGE_NPMJS_SKIP" == "true" ] || [ "$VONAGE_GITHUB_SKIP" == "true" ] || \
               [ "$OPENTOK_NPMJS_SKIP" == "true" ] || [ "$OPENTOK_GITHUB_SKIP" == "true" ]; then
              echo "::error::Version is already published — cannot re-publish with a specific target."
              exit 1
            fi
          fi

      # Reads the final version and name written to lib/js/package.json by the publish action.
      # Skipped entirely on dry runs — no tag or release is created.
      - name: Resolve published version
        if: ${{ !fromJSON(inputs.dry_run) }}
        id: release-meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./lib/js/package.json').version")
          NAME=$(node -p "require('./lib/js/package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$NAME" >> "$GITHUB_OUTPUT"
          # All targets share the same version tag so that publishing vonage and opentok
          # variants of the same version produces a single GitHub Release.
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Promotes the Release Drafter draft if one exists (accumulated changelog from all
      # PR merges since the last release). Falls back to a fresh release with auto-generated
      # notes if no draft is found (e.g., first release or draft was manually deleted).
      # Idempotent: if the release already exists (a sibling target published first),
      # this step is a no-op — all four publish targets share the same version tag.
      - name: Publish GitHub Release
        if: ${{ !fromJSON(inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          DRAFT_TAG=$(gh release list --json tagName,isDraft \
            --jq '[.[] | select(.isDraft==true)] | first | .tagName // empty')

          if [ -n "$DRAFT_TAG" ]; then
            echo "Promoting draft '$DRAFT_TAG' → '$TAG'"
            gh release edit "$DRAFT_TAG" --tag "$TAG" --title "v${VERSION}" --draft=false
          else
            echo "No draft found — creating release '$TAG'"
            gh release create "$TAG" --title "v${VERSION}" --generate-notes
          fi

  smoke-test:
    name: Smoke Test v${{ needs.publish.outputs.version }} (${{ inputs.target }})
    needs: publish
    if: ${{ !fromJSON(inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: '@vonage/video-client-network-test → npmjs.com'
        id: smoke-vonage-npmjs
        if: needs.publish.outputs.vonage-npmjs-published == 'true'
        continue-on-error: true
        uses: ./.github/actions/smoke-test-package
        with:
          package_name: '@vonage/video-client-network-test'
          version: ${{ needs.publish.outputs.version }}

      - name: '@vonage/video-client-network-test → GitHub Packages'
        id: smoke-vonage-github
        if: needs.publish.outputs.vonage-github-published == 'true'
        continue-on-error: true
        uses: ./.github/actions/smoke-test-package
        with:
          package_name: '@vonage/video-client-network-test'
          version: ${{ needs.publish.outputs.version }}
          registry: github
          scope: '@vonage'
          auth_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'opentok-network-test-js → npmjs.com'
        id: smoke-opentok-npmjs
        if: needs.publish.outputs.opentok-npmjs-published == 'true'
        continue-on-error: true
        uses: ./.github/actions/smoke-test-package
        with:
          package_name: opentok-network-test-js
          version: ${{ needs.publish.outputs.version }}

      - name: '@opentok/opentok-network-test-js → GitHub Packages'
        id: smoke-opentok-github
        if: needs.publish.outputs.opentok-github-published == 'true'
        continue-on-error: true
        uses: ./.github/actions/smoke-test-package
        with:
          package_name: '@opentok/opentok-network-test-js'
          version: ${{ needs.publish.outputs.version }}
          registry: github
          scope: '@opentok'
          auth_token: ${{ secrets.NPM_TOKEN_OPENTOK_GITHUB }}

      - name: Summary
        if: always()
        env:
          VN: ${{ steps.smoke-vonage-npmjs.outcome }}
          VG: ${{ steps.smoke-vonage-github.outcome }}
          ON: ${{ steps.smoke-opentok-npmjs.outcome }}
          OG: ${{ steps.smoke-opentok-github.outcome }}
        shell: bash
        run: |
          status() {
            case "$1" in
              success)   echo "✅ \`ok\`" ;;
              skipped)   echo "⏭️ \`not published\`" ;;
              *)         echo "❌ \`$1\`" ;;
            esac
          }
          echo "### Smoke Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | ESM + Function Call |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@vonage/video-client-network-test\` → npmjs.com       | $(status "$VN") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@vonage/video-client-network-test\` → GitHub Packages | $(status "$VG") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`opentok-network-test-js\` → npmjs.com                 | $(status "$ON") |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@opentok/opentok-network-test-js\` → GitHub Packages  | $(status "$OG") |" >> "$GITHUB_STEP_SUMMARY"

          fails() { [ "$1" == "failure" ] || [ "$1" == "cancelled" ]; }
          if fails "$VN" || fails "$VG" || fails "$ON" || fails "$OG"; then
            echo "::error::One or more smoke tests failed — see summary above."
            exit 1
          fi
