name: 'Setup Environment'
description: 'Sets up Node.js, applies the OpenTok source patch (opentok target only), regenerates the lockfile so the cache key is consistent, and restores node_modules from cache'
inputs:
  target:
    description: 'Target package (vonage or opentok)'
    required: true
  node_version:
    description: 'Node.js version to use (e.g. 24.x)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    # The opentok.patch swaps the vonage SDK dependency for the legacy OpenTok SDK in
    # lib/js/package.json. The lockfile must be regenerated after patching so the cache key
    # (which hashes the lockfile) matches the key the downstream build job will compute
    # from the uploaded source artifact — without this, the build job gets a cache miss.
    - name: Apply OpenTok source patch and regenerate lockfile
      if: inputs.target == 'opentok'
      shell: bash
      run: |
        git apply ./lib/js/opentok.patch
        # --prefix runs npm from the repo root; composite action steps cannot set
        # working-directory per step, so --prefix is the workaround here.
        npm --prefix lib/js install --package-lock-only

    - name: Restore Node Modules
      uses: ./.github/actions/restore-node-modules
      with:
        target: ${{ inputs.target }}
